[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-mcp"
version = "0.1.0"
description = "MCP server that gives OpenCode (or any MCP client) live MetaTrader 5 data and guarded order execution - no Windows Python under Wine required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "trade-mcp contributors" }]
keywords = ["mcp", "metatrader", "mt5", "trading", "xauusd", "opencode"]
dependencies = [
  "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
trade-mcp = "trade_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",  # long lines are fine in docstrings/JSON examples
  "SIM108", # ternaries are not always clearer
]
